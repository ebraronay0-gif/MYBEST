name: MYBEST Direct APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub dosyalarını al
        uses: actions/checkout@v4

      - name: ZIP'i bul ve çıkart
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: ZIP bulunamadı!"
            exit 1
          fi

          rm -rf proje
          mkdir -p proje
          unzip -q "$ZIP_FILE" -d proje

          APP_JSON=$(find proje -type f -name "app.json" -print -quit)

          if [ -z "$APP_JSON" ]; then
            echo "HATA: app.json bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$APP_JSON")

          echo "Proje: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Eski Expo paketlerini temizle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          npm pkg delete dependencies.expo-constants
          npm pkg delete dependencies.expo-haptics
          npm pkg delete dependencies.expo-image-picker
          npm pkg delete dependencies.expo-linking
          npm pkg delete dependencies.expo-localization
          npm pkg delete dependencies.expo-router
          npm pkg delete dependencies.expo-status-bar

          npm pkg set dependencies.expo="~57.0.0"

          rm -rf node_modules
          rm -f package-lock.json

      - name: Expo SDK 57'yi kur
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          npm install expo@~57.0.0 --legacy-peer-deps

      - name: Expo paketlerini doğru sürümlerle kur
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          npx expo install \
            expo-constants \
            expo-haptics \
            expo-image-picker \
            expo-linking \
            expo-localization \
            expo-router \
            expo-status-bar \
            react-native-safe-area-context \
            react-native-screens

      - name: Bağımlılıkları tamamla
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          npm install --legacy-peer-deps

      - name: Android ayarlarını düzelt
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json

          with open("app.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          expo = data.setdefault("expo", {})

          expo["newArchEnabled"] = False

          android = expo.setdefault("android", {})
          android["package"] = "com.mybest.ai"

          with open("app.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print("New Architecture: FALSE")
          print("Android package: com.mybest.ai")
          PY

      - name: Expo yapılandırmasını kontrol et
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          npx expo config --type public

      - name: Android projesini temiz oluştur
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          CI: "1"
        run: |
          npx expo prebuild --platform android --clean

      - name: Gradle temizle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean --no-daemon

      - name: Release APK oluştur
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        env:
          CI: "1"
          NODE_ENV: production
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: APK kontrolü
        shell: bash
        run: |
          APK_DIR="$PROJECT_DIR/android/app/build/outputs/apk/release"

          find "$APK_DIR" -type f -name "*.apk"

          if ! find "$APK_DIR" -type f -name "*.apk" | grep -q ".apk"; then
            echo "HATA: APK oluşmadı!"
            exit 1
          fi

      - name: MYBEST APK
        uses: actions/upload-artifact@v4
        with:
          name: MYBEST-APK-FIXED
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
