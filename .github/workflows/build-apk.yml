name: MYBEST APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub dosyalarını al
        uses: actions/checkout@v4

      - name: ZIP'i çıkart
        run: |
          mkdir mybest
          unzip -q MYBEST-gemini-test-ready.zip -d mybest
          echo "ZIP çıkarıldı"
          find mybest -name package.json

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Proje klasörünü bul
        run: |
          PROJECT=$(find mybest -name package.json -not -path "*/node_modules/*" | head -1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          echo "Proje: $PROJECT"

      - name: Expo ve Constants sürümlerini düzelt
        working-directory: ${{ env.PROJECT }}
        run: |
          npm install expo@~57.0.0 expo-constants@~57.0.17 --legacy-peer-deps

      - name: Expo paketlerini hizala
        working-directory: ${{ env.PROJECT }}
        run: |
          npx expo install --fix

      - name: Bağımlılıkları tamamla
        working-directory: ${{ env.PROJECT }}
        run: |
          npm install --legacy-peer-deps

      - name: EAS kurulumu
        run: npm install -g eas-cli

      - name: APK oluştur
        working-directory: ${{ env.PROJECT }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive
