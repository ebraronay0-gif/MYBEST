name: MYBEST Direct APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub dosyalarını al
        uses: actions/checkout@v4

      - name: ZIP'i çıkart
        run: |
          mkdir mybest
          unzip -q MYBEST-gemini-test-ready.zip -d mybest
          echo "ZIP çıkarıldı"
          find mybest -name package.json

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Proje klasörünü bul
        run: |
          PROJECT=$(find mybest -name package.json -not -path "*/node_modules/*" | head -1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          echo "Proje klasörü: $PROJECT"

      - name: Expo SDK 57 sürümlerini ayarla
        working-directory: ${{ env.PROJECT }}
        run: |
          npm pkg set dependencies.expo="~57.0.0"
          npm pkg set dependencies.expo-constants="~57.0.17"
          npm pkg set dependencies.expo-haptics="~57.0.2"
          npm pkg set dependencies.expo-image-picker="~57.0.16"
          npm pkg set dependencies.expo-linking="~57.0.9"
          npm pkg set dependencies.expo-localization="~57.0.1"
          npm pkg set dependencies.expo-router="~57.0.19"
          npm pkg set dependencies.expo-status-bar="~57.0.1"

      - name: Bağımlılıkları kur
        working-directory: ${{ env.PROJECT }}
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: Expo yapılandırmasını kontrol et
        working-directory: ${{ env.PROJECT }}
        run: |
          npx expo config --type public

      - name: Android projesini oluştur
        working-directory: ${{ env.PROJECT }}
        run: |
          npx expo prebuild --platform android --no-install

      - name: Gradle izinlerini ver
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x android/gradlew

      - name: Android APK oluştur
        working-directory: ${{ env.PROJECT }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: APK'yı GitHub'a yükle
        uses: actions/upload-artifact@v4
        with:
          name: MYBEST-APK
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
