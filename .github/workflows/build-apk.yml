name: MYBEST Direct APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub dosyalarını al
        uses: actions/checkout@v4

      - name: ZIP'i bul ve çıkart
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: ZIP bulunamadı!"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          rm -rf proje
          mkdir -p proje
          unzip -q "$ZIP_FILE" -d proje

          APP_JSON=$(find proje -type f -name "app.json" -print -quit)

          if [ -z "$APP_JSON" ]; then
            echo "HATA: app.json bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$APP_JSON")

          echo "Proje: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Android ayarlarını güvenli hale getir
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          import json

          with open("app.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          expo = data.setdefault("expo", {})

          # Android başlangıç çökme riskini azalt
          expo["newArchEnabled"] = False

          android = expo.setdefault("android", {})
          android["package"] = "com.mybest.ai"

          with open("app.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print("New Architecture: FALSE")
          print("Android package: com.mybest.ai")
          PY

      - name: Bağımlılıkları kur
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          rm -rf node_modules
          rm -f package-lock.json

          npm install --legacy-peer-deps

      - name: Expo Android projesini temiz oluştur
        shell: bash
        env:
          CI: "1"
        run: |
          set -e
          cd "$PROJECT_DIR"

          npx expo prebuild --platform android --clean

      - name: Gradle temizle
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew clean --no-daemon

      - name: Release APK oluştur
        shell: bash
        env:
          CI: "1"
          NODE_ENV: production
        run: |
          set -e
          cd "$PROJECT_DIR/android"

          ./gradlew assembleRelease --no-daemon

      - name: APK kontrolü
        shell: bash
        run: |
          APK_DIR="$PROJECT_DIR/android/app/build/outputs/apk/release"

          echo "APK dosyaları:"
          find "$APK_DIR" -type f -name "*.apk"

          APK_COUNT=$(find "$APK_DIR" -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "HATA: APK oluşmadı!"
            exit 1
          fi

      - name: MYBEST APK
        uses: actions/upload-artifact@v4
        with:
          name: MYBEST-APK-FIXED
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
